<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Links</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .card {
      width: min(92%, 560px);
      padding: 32px 24px;
      box-sizing: border-box;
      text-align: center;
      background: #222;
      border-radius: 16px;
    }

    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 22px;
      border-radius: 8px;
      background: #f2b400;
      color: #111;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>My Links</h1>
    <p>Useful link:</p>

    <a class="button"
       href="https://mdir.cc/"
       target="_blank"
       rel="noopener noreferrer">
      Visit MDIR
    </a>
  </main>
</body>
</html>
